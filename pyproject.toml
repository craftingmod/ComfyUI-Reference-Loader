[project]
name = "comfyui-reference-loader"
description = "ComfyUI reference media loader for diffusion models."
version = "1.0.0"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/craftingmod/ComfyUI-Reference-Loader"
[tool.comfy]
PublisherId = "alyac"
DisplayName = "Reference Media Loader"
Icon = "https://cdn.jsdelivr.net/gh/craftingmod/ComfyUI-Reference-Loader/assets/icon.svg"
includes = ["dist"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.3"]
